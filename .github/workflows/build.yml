name: Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions: {}

concurrency:
  group: ${{ github.ref == 'refs/heads/master' && format('{0}-{1}', github.workflow, github.ref) || github.run_id }}

jobs:
  before-build:
    name: Before build
    runs-on: ubuntu-slim

    outputs:
      deployment-environment: ${{ steps.classify.outputs.environment }}
      build-number: ${{ steps.build-number.outputs.build-number }}

    steps:
      # This classifies the build type for deployment. When set, it indicates that a deployment will take place. This
      # won't be set for unofficial builds (e.g. pull request builds).
      - name: Classify build type
        id: classify
        shell: pwsh
        run: |
          $environment = switch -Regex ('${{ github.ref }}') {
            '^refs/heads/master$' {
              'dev'
              break
            }

            default {
              ''
            }
          }

          "environment=$environment" >> $env:GITHUB_OUTPUT

      # Note that the offset below brings the build number in line with the previous AppVeyor build number. Unofficial
      # builds always use a build number of 0.
      - name: Calculate build number
        id: build-number
        shell: pwsh
        env:
          DEPLOYMENT_ENVIRONMENT: ${{ steps.classify.outputs.environment }}
        run: |
          if ($env:DEPLOYMENT_ENVIRONMENT) {
            $buildNumber = [int] $env:GITHUB_RUN_NUMBER + 2809
          } else {
            $buildNumber = 0
          }

          "build-number=$buildNumber" >> $env:GITHUB_OUTPUT

  build:
    name: Build ${{ matrix.configuration }} / ${{ matrix.platform }}
    needs: before-build

    permissions:
      contents: read

    strategy:
      fail-fast: false

      matrix:
        include:

          - configuration: Release
            platform: x64
            runner: windows-2022
            msbuild-architecture: x64
            publish: true


    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 0

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
        with:
          msbuild-architecture: ${{ matrix.msbuild-architecture }}

      - name: Cache vcpkg binary packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-${{ matrix.configuration }}-${{ matrix.platform }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-${{ matrix.configuration }}-${{ matrix.platform }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}

      - name: Bootstrap vcpkg
        run: Explorer++/ThirdParty/vcpkg/bootstrap-vcpkg.bat

      - name: Build
        run: |
          msbuild `
            Explorer++/Explorer++.sln `
            /p:Configuration=${{ matrix.configuration }} `
            /p:Platform=${{ matrix.platform }} `
            /p:ExplorerPlusPlusBuildVersion=${{ needs.before-build.outputs.build-number }} `
            /v:minimal

      - name: Run tests
        run: ./.github/run_tests.ps1 -Configuration '${{ matrix.configuration }}' -Platform '${{ matrix.platform }}'

      - name: Package artifacts
        if: matrix.publish
        run: ./.github/package.ps1 -Configuration '${{ matrix.configuration }}' -Platform '${{ matrix.platform }}'

      - name: Upload artifacts
        if: matrix.publish
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Explorer++.${{ matrix.configuration }}.${{ matrix.platform }}
          path: artifacts
          if-no-files-found: error
          compression-level: 0

